<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>
<style>
    ul {
        counter-reset: number;
        list-style: none;
    }
    
    li {
        counter-increment: number 2;
    }
    
    li::before {
        content: counter(number)".";
    }
</style>

<body>
    <ul>
        <li> Tea</li>
        <li> Cookess</li>
        <li> Bread</li>
        <li> Pau</li>
        <li> Fruits</li>
        <li> Vegtables</li>
    </ul>

</body>

</html>
