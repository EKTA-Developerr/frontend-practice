<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data types</title>
</head>

<body>
    <h2>Data types practice</h2>
    <script>
        let a = "ekta";
        let age = 20;
        let isstudent = true;
        let city;
        let address = null;
        let b = {
            name: "ekta"
        };
        let c = ["apple", "banana", "orange"];

        let x = 20;
        let y = 10;
        add()


        function add() {
            let ans = x + y;
            document.write(ans + "<br>. ");
            return;
        }

        console.log(typeof(a + "<br>")); //console me show
        document.write(typeof a + "<br>");
        document.write(typeof age + "<br>");
        document.write(typeof isstudent + "<br>");
        document.write(typeof city + "<br>");
        document.write(typeof address + "<br>");
        document.write(b.name + "<br>");
        document.write(c[1] + "<br>");
        document.write(c[2] + "<br>");
    </script>
</body>

</html>
