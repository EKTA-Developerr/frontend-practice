        //Login
        let username = "admi";

                document.write("login Successful");

            }

        } else {

        }
        // Voting

        let marks = 60;

        if (remark === "pass") {

            }

        }
        document.write("<br>" + tex);

        //ATM
        function atm() {
            let pin = Number(document.getElementById("password").value);
            let balance = 10000;

            let amount = Number(document.getElementById("amount").value);

            if (pin === 1234) {

                if (balance >= amount) {
                    balance = balance - amount;
                    document.getElementById("result").innerHTML = "Transaction Successful<br>" + "withdraw Amount: " + amount + "<br>Remaining Balance: " + balance;
                } else {
                    document.getElementById("result").innerHTML = "Insufficient Balance";
                }
            } else {
                document.getElementById("result").innerHTML = "Wrong PIN!";
            }
        }

        //Online Shopping
        let member = "yes";
        let amount = 7000;
        if (member === "yes") {
            if (amount >= 5000) {
                let discount = (amount * 10) / 100;
                let finalamount = amount - discount;

                document.write("<br>Discount:" + discount);
                document.write("<br>finalamount: " + finalamount);

        //3-Level Nested if
        let student = 12;

        if (student === 12) {
