<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button click hidden image show</title>
</head>

<body>
    <img id="img" src="Natural.jpg" style="display:none;" width="800">
    <button type="button" onclick="showimg()">
        Show image
    </button>
    <script>
        function showimg() {
            document.getElementById("img").style.display = "block";
        }
    </script>
</body>

</html>
