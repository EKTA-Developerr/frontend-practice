<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            perspective: 1000px;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }
        
        .dice {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 5s linear infinite;
        }
        
        .front,
        .back,
        .left,
        .right {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            font-family: sans-serif;
            border: 2px solid rgba(255, 255, 255, 0.5);
            opacity: 0.9;
        }
        
        .front {
            transform: translateZ(100px);
            background: red;
        }
        
        .back {
            transform: rotateY(180deg)translateZ(100px);
            background: yellow;
        }
        
        .left {
            transform: rotateY(-90deg)translateZ(100px);
            background: orange;
        }
        
        .right {
            transform: rotateY(90deg) translateZ(100px);
            background: green;
        }
        
        @keyframes spin {
            from {
                transform: rotateX(0deg) rotateY(0deg);
            }
            to {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }
    </style>
</head>

<body>
    <h1>3D Dice</h1>
    <div class="container">
        <div class="dice">
            <div class="front">1</div>
            <div class="back">2</div>
            <div class="left">3</div>
            <div class="right">4</div>
        </div>
    </div>

</body>

</html>
