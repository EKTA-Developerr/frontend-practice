<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear gradient</title>
    <style>
        .text {
            font-size: 50px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        p {
            background-image: repeating-linear-gradient(to right, red, yellow 10%, purple 20%);
            font-size: 50px;
            padding: 20px 50px;
            color: white;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="text">
        <p>Ekta</p>
    </div>

</body>

</html>
