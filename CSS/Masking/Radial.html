<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial Gradients </title>
</head>
<style>
    .mask1 {
        mask-image: radial-gradient(ellipse, black 60%, rgba(0, 0, 0, 0.5) 50%);
        mask-image: radial-gradient(circle, black 60%, transparent 100%);
        mask-repeat: no-repeat;
        mask-position: center;
    }
</style>
</head>

<body>
    <img class="mask1" src="Natural.jpg" width="600" height="400">

</body>

</html>
