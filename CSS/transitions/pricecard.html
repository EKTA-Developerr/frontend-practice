<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
        }
        
        .container {
            width: 300px;
            height: 400px;
        }
        
        .content {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .container:hover .content {
            transform: rotateX(180deg);
        }
        
        .front-card,
        .back-card {
            position: absolute;
            text-align: center;
            backface-visibility: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .front-card {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        
        .front-card h2 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        
        .front-card p {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 10px;
        }
        
        .back-card {
            background: #ffffff;
            color: #2d3436;
            transform: rotateX(180deg);
        }
        
        .back-card p {
            font-size: 40px;
            font-weight: bold;
            margin: 0;
        }
        
        .btn {
            margin-top: 10px;
            padding: 10px 30px;
            border: none;
            background: white;
            cursor: pointer;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
            transition: 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            background-color: #5143d9;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="front-card">
                <h2>Web Dev</h2>
                <p>MERN Stack Course</p>
            </div>

            <div class="back-card">
                <p>PERMIUM ACCESS</p>
                <h1>$499,00</h1>
                <button class="btn">Buy Now</button>
            </div>
        </div>
    </div>

</body>

</html>
