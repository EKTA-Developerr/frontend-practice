<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        div {
            width: 100px;
            height: 100px;
            background: red;
        }
        
        div:hover {
            transform: translate(120px, 100px);
        }
        
        #first {
            width: 100px;
            height: 100px;
            background: yellow;
        }
        
        #first:hover {
            transform: rotate(-30deg);
        }
    </style>
</head>

<body>
    <div></div>
    <div id="first"></div>
</body>

</html>
