<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .btn {
            width: 100px;
            height: 30px;
            background-color: green;
            color: white;
            transition: transform 0.4s ease;
        }
        
        .btn:hover {
            background: blue;
            transform: scale(0.90);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="btns">
        <button class="btn">Clike</button>
    </div>

</body>

</html>
