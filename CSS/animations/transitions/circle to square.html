<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .box {
            width: 100px;
            height: 100px;
            background: yellowgreen;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            transition: all 1s ease;
            border-radius: 50%;
        }
        
        .box:hover {
            border-radius: 0;
            transform: translateY(100px);
        }
    </style>
</head>

<body>
    <div class="box">circle to square</div>

</body>

</html>
