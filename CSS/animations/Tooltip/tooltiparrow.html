<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TooltipArrow</title>
    <style>
        body {
            text-align: center;
        }
        
        .tooltip {
            position: relative;
            display: inline-block;
            font-size: 20px;
            text-align: center;
            cursor: pointer;
            margin-top: 30px;
        }
        
        .tooltiptext {
            position: absolute;
            visibility: hidden;
            width: 150px;
            background: black;
            color: white;
            border-radius: 4px;
            transform: translateX(-50%);
            left: 50%;
            bottom: 125%;
        }
        
        .tooltiptext::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            border-width: 5px;
            border-style: solid;
            border-color: black transparent transparent transparent;
        }
        
        .tooltip:hover .tooltiptext {
            visibility: visible;
        }
    </style>
</head>

<body>
    <div class="tooltip">
        <button>SAVAE</button>
        <span class="tooltiptext">Click here!</span>
    </div>

</body>

</html>
