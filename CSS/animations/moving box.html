<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .square {
            width: 100px;
            height: 100px;
            background: yellow;
            animation-name: movingsquare;
            animation-duration: 2s;
            animation-timing-function: ease-in-out;
            animation-delay: 2s;
            animation-iteration-count: infinite;
            position: relative;
        }
        
        @keyframes movingsquare {
            0% {
                top: 0px;
            }
            50% {
                top: 700px;
            }
            100% {
                top: 0px;
            }
        }
    </style>
</head>

<body>
    <div class="square"></div>

</body>

</html>
