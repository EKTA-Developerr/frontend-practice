<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
            background-color: #eef2f3;
            margin: 0;
        }
        
        .parents {
            width: 300px;
            height: 400px;
        }
        
        .child {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCard 6s linear infinite;
        }
        
        .front-box,
        .back-box {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            font-family: sans-serif;
        }
        
        .front-box {
            /* background: linear-border; */
            background: #8e44ad;
            color: white;
            transform: translateZ(10px);
        }
        
        .back-box {
            background: #2c3e50;
            color: #ecf0f1;
            transform: rotateX(180deg) translateZ(10px);
        }
        
        @keyframes rotateCard {
            from {
                transform: rotateX(0deg);
            }
            to {
                transform: rotateX(360deg);
            }
        }
    </style>
</head>

<body>
    <section>
        <div class="parents">
            <div class="child">
                <div class="front-box">
                    <h2>Front-Side</h2>
                </div>
                <div class="back-box">
                    <h2>Back-Side</h2>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
