<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: white;
            font-size: 50px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* background-image: repeating-radial-gradient( red, yellow 10%, purple 15%); */
            color: whitesmoke;
            text-shadow: 2px 5px 5px black;
        }
        /* #seconed {
            background-image: linear-gradient(to right, rgba(255, 0, 0, 0), rgb(255, 0, 1));
            width: 500px;
        } */
        
        .insta {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%);
            width: 200px;
            height: 200px;
            border-radius: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .inner-square {
            width: 120px;
            height: 120px;
            border: 8px solid white;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .inner-square::after {
            content: '';
            width: 45px;
            height: 45px;
            border: 8px solid white;
            border-radius: 50%;
        }
        
        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: absolute;
            top: 8%;
            right: 8%;
            z-index: 10;
            background-color: white;
        }
    </style>
</head>

<body>
    <!-- <div id="first">
        <p>Ekta</p>
    </div> -->
    <!-- <div id="seconed">
        ekta
    </div> -->
    <div class="insta">
        <div class="inner-square">
            <div class="dot"></div>
        </div>
    </div>

</body>

</html>
